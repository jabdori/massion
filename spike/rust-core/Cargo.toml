[package]
name = "massion-core-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ryu-js = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
surrealdb = { version = "=4.0.1", default-features = false, features = ["kv-surrealkv"] }
surrealkv = "=1.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

[profile.release]
strip = "symbols"
