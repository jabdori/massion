<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신청</title><link rel="stylesheet" href="page.css"></head><body><header><p class="brand library">시립도서관</p><p>이용 안내</p><p>스터디룸</p><p class="active">신청</p><p class="last">내 신청</p></header><main><h1>스터디룸 신청</h1><form class="form"><div><label for="name">이름</label><input id="name" autocomplete="name" value="홍길동"></div><div><label for="phone">연락처</label><input id="phone" type="tel" autocomplete="tel" value="010-0000-0000"></div><div><label for="date">날짜</label><select id="date"><option>11월 11일 (수)</option></select></div><div><label for="time">시간</label><select id="time"><option>15:00–17:00</option></select></div><div><label for="room">방</label><select id="room"><option>스터디룸 B</option></select></div><div><label for="count">인원</label><select id="count"><option>4명</option></select></div></form><button type="button" autofocus>신청서 제출</button></main></body></html>
