[package]
name = "massion-desktop"
version = "1.0.0"
description = "Massion AgentOS desktop shell (Tauri) — 로컬 서버 콘솔을 감싸는 native shell"
authors = ["Massion"]
edition = "2021"

[lib]
name = "massion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
