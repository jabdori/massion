[package]
name = "massion-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["carrier"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
massion-carrier = { path = "carrier" }

[lib]
name = "massion_tauri"
