name: Private desktop candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 검증할 후보 commit SHA
        required: true
        type: string
      uat_evidence:
        description: 실제 Tauri 23개 UAT evidence 경로
        required: true
        default: docs/evidence/phase-30/personal-desktop-release-2026-07-25.md
        type: string

permissions:
  contents: read
  actions: write

jobs:
  verify:
    name: 서명·공증·실제 UAT 후보 검증
    runs-on: macos-14
    steps:
      - name: 후보 소스 확인
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js 설치
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: pnpm 설치
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate

      - name: 고정 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 개인용 후보 빌드
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @massion/desktop tauri:build

      - name: 개인용 후보 검증
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          UAT_EVIDENCE: ${{ inputs.uat_evidence }}
        run: |
          app_path="$(find apps/desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          node scripts/verify-desktop-release.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --app "$app_path" \
            --uat-evidence "$UAT_EVIDENCE"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" Massion-private-candidate.zip

      - name: 비공개 후보 artifact 보관
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: massion-private-desktop-candidate-${{ inputs.candidate_sha }}
          path: Massion-private-candidate.zip
          if-no-files-found: error
          retention-days: 14
