name: Candidate checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install verified SurrealDB prerequisite
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 -o /tmp/surreal.tgz https://github.com/surrealdb/surrealdb/releases/download/v3.3.0/surreal-v3.3.0.linux-amd64.tgz
          echo '44aeab565f7e7e39d2d0bf0583c8aae648babc91373c70b2658288d95bbbcd55  /tmp/surreal.tgz' | sha256sum --check
          mkdir /tmp/massion-surreal
          tar -xzf /tmp/surreal.tgz -C /tmp/massion-surreal
      - name: Clean install, normal CLI, upgrade and portable restore
        env:
          MASSION_SURREAL_BINARY: /tmp/massion-surreal/surreal
        run: bash scripts/install-smoke.sh
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static types, runtime syntax and unit checks
        run: npm run check
      - name: Cache the pinned SurrealDB archive
        uses: actions/cache@v4
        with:
          path: /tmp/surreal.tgz
          key: surreal-v3.3.0-linux-amd64-44aeab565f7e7e39d2d0bf0583c8aae648babc91373c70b2658288d95bbbcd55
      - name: Verify official SurrealDB archive
        shell: bash
        run: |
          [ -s /tmp/surreal.tgz ] || curl --fail --location --retry 10 --retry-delay 30 --retry-all-errors --proto '=https' --tlsv1.2 -o /tmp/surreal.tgz https://github.com/surrealdb/surrealdb/releases/download/v3.3.0/surreal-v3.3.0.linux-amd64.tgz
          echo '44aeab565f7e7e39d2d0bf0583c8aae648babc91373c70b2658288d95bbbcd55  /tmp/surreal.tgz' | sha256sum --check
          mkdir /tmp/massion-surreal
          tar -xzf /tmp/surreal.tgz -C /tmp/massion-surreal
      - name: Actual durable-store aggregate, crash and restore
        env:
          MASSION_SURREAL_BINARY: /tmp/massion-surreal/surreal
        run: python3 scripts/with-surreal.py -- env MASSION_TEST_SURREAL_RESTART=1 node --test --test-concurrency=1 tests/*.test.ts
