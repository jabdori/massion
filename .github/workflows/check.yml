name: Candidate checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install verified SurrealDB prerequisite
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 -o /tmp/surreal.tgz https://github.com/surrealdb/surrealdb/releases/download/v4.0.1/surreal-v4.0.1.linux-amd64.tgz
          echo '9d9d26313bf3f1aeffd066def9493932c79053fc9bca8f1b39f83d511f65577d  /tmp/surreal.tgz' | sha256sum --check
          mkdir /tmp/massion-surreal
          tar -xzf /tmp/surreal.tgz -C /tmp/massion-surreal
      - name: Clean install, normal CLI, upgrade and portable restore
        env:
          MASSION_SURREAL_BINARY: /tmp/massion-surreal/surreal
        run: bash scripts/install-smoke.sh
  browser-adapter-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned agent-browser and headless browser
        run: |
          npm install --global agent-browser@0.41.2
          agent-browser install
      - name: Verify openssl is on PATH
        run: |
          command -v openssl
          openssl version
      - name: Smoke the member browser adapter against the real agent-browser
        timeout-minutes: 5
        run: node scripts/smoke-agent-browser.ts
  isolation-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Default-deny OS sandbox around the app worker and the oracle; real CLI launcher execution
        run: node --test tests/os-isolation.test.ts tests/confinement-record.test.ts tests/execution.test.ts tests/apps.test.ts tests/cli-signature.test.ts tests/cli-launcher-real.test.ts
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static types, runtime syntax and unit checks
        run: npm run check
      - name: Cache the pinned SurrealDB archive
        uses: actions/cache@v4
        with:
          path: /tmp/surreal.tgz
          key: surreal-v4.0.1-linux-amd64-9d9d26313bf3f1aeffd066def9493932c79053fc9bca8f1b39f83d511f65577d
      - name: Verify official SurrealDB archive
        shell: bash
        run: |
          [ -s /tmp/surreal.tgz ] || curl --fail --location --retry 10 --retry-delay 30 --retry-all-errors --proto '=https' --tlsv1.2 -o /tmp/surreal.tgz https://github.com/surrealdb/surrealdb/releases/download/v4.0.1/surreal-v4.0.1.linux-amd64.tgz
          echo '9d9d26313bf3f1aeffd066def9493932c79053fc9bca8f1b39f83d511f65577d  /tmp/surreal.tgz' | sha256sum --check
          mkdir /tmp/massion-surreal
          tar -xzf /tmp/surreal.tgz -C /tmp/massion-surreal
      - name: Actual durable-store aggregate, crash and restore
        env:
          MASSION_SURREAL_BINARY: /tmp/massion-surreal/surreal
        run: python3 scripts/with-surreal.py -- env MASSION_TEST_SURREAL_RESTART=1 node --test --test-concurrency=1 tests/*.test.ts
