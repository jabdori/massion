name: Browser idle-shutdown measurement
on:
  push:
    branches: [exp/browser-second-start]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        condition: [idle-60, idle-60-no-chrome, sigterm-starting, sigterm-ready]
        sample: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned browser tool
        run: |
          npm install --global agent-browser@0.41.2
          agent-browser install --with-deps
          sudo -n apt-get install --yes fonts-noto-cjk xvfb xauth libnss3-tools
      - name: Measure the four leftovers after the startup limit
        env:
          B1_CONDITION: ${{ matrix.condition }}
        run: bash scripts/experiments/browser-second-start.sh
