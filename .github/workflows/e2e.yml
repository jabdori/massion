name: End-to-end journeys
on:
  pull_request:
    paths-ignore: ['docs/acceptance/**', 'docs/architecture/**', 'docs/guide/**']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install headless browser
        run: |
          npm install --global agent-browser@0.41.2
          agent-browser install --with-deps
          sudo apt-get install --yes fonts-noto-cjk xvfb xauth
      - name: Build the desktop shell
        run: |
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          npm run install:electron --prefix desktop
          npm run build --prefix desktop
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Install verified SurrealDB prerequisite
        shell: bash
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o /tmp/surreal.tgz https://github.com/surrealdb/surrealdb/releases/download/v3.3.0/surreal-v3.3.0.linux-amd64.tgz
          echo '44aeab565f7e7e39d2d0bf0583c8aae648babc91373c70b2658288d95bbbcd55  /tmp/surreal.tgz' | sha256sum --check
          mkdir /tmp/massion-surreal
          tar -xzf /tmp/surreal.tgz -C /tmp/massion-surreal
      - name: Drive real daemon and durable journeys with local model fixtures
        env:
          MASSION_SURREAL_BINARY: /tmp/massion-surreal/surreal
          MASSION_E2E_BROWSER: /usr/bin/google-chrome
        run: |
          "$MASSION_E2E_BROWSER" --version
          node --test scripts/e2e/browser-*.test.mjs
          xvfb-run -a python3 scripts/with-surreal.py --timeout 480 -- npm run e2e
      - name: Upload accessibility snapshots, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journeys
          path: .runtime/e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
