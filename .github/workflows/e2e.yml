name: End-to-end journeys
on:
  pull_request:
    paths-ignore: ['docs/acceptance/**', 'docs/architecture/**', 'docs/guide/**']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # No MASSION_BROWSER_CONTAINER_IS_SANDBOX_BOUNDARY here: the runner VM has no container
    # markers, so by the rule it is a host and the product path (openBrowserEnvironment in
    # browser-actions / environment-work) must run Chrome with its own sandbox on, as on main.
    # Script-level direct agent-browser calls in this job (npm run e2e) inherit CI and so run
    # unsandboxed; they are test harness, not product, as on main.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install headless browser
        run: |
          npm install --global agent-browser@0.41.2
          agent-browser install --with-deps
          sudo apt-get install --yes fonts-noto-cjk xvfb xauth
      - name: Build the desktop shell
        run: |
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          npm run install:electron --prefix desktop
          npm run build --prefix desktop
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Install verified SurrealDB prerequisite
        shell: bash
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o /tmp/surreal.tgz https://github.com/surrealdb/surrealdb/releases/download/v4.0.1/surreal-v4.0.1.linux-amd64.tgz
          echo '9d9d26313bf3f1aeffd066def9493932c79053fc9bca8f1b39f83d511f65577d  /tmp/surreal.tgz' | sha256sum --check
          mkdir /tmp/massion-surreal
          tar -xzf /tmp/surreal.tgz -C /tmp/massion-surreal
      - name: Drive real daemon and durable journeys with local model fixtures
        env:
          MASSION_SURREAL_BINARY: /tmp/massion-surreal/surreal
          MASSION_E2E_BROWSER: /usr/bin/google-chrome
        run: |
          sample='${{ matrix.sample }}'
          if (( sample <= 3 )); then
            python3 scripts/e2e/flake-260-diagnose.py desktop-ready
            xvfb-run -a python3 scripts/with-surreal.py --timeout 480 -- npm run e2e
            exit
          fi
          python3 scripts/e2e/flake-260-diagnose.py headless
          "$MASSION_E2E_BROWSER" --version
          chrome_dir=$(dirname "$(readlink -f "$MASSION_E2E_BROWSER")")
          echo "Chrome directory: $chrome_dir"
          findmnt -n -o SOURCE,MAJ:MIN -T "$chrome_dir/chrome"
          if (( sample <= 6 )); then
            sync
            python3 - "$chrome_dir" <<'PY_COLD'
          import os
          from pathlib import Path
          import sys
          for path in Path(sys.argv[1]).rglob('*'):
              if path.is_file():
                  with path.open('rb') as f:
                      os.posix_fadvise(f.fileno(), 0, 0, os.POSIX_FADV_DONTNEED)
          PY_COLD
            echo "FLAKE-260 Chrome package pages evicted"
          else
            find "$chrome_dir" -type f -readable -exec cat {} + >/dev/null
            echo "FLAKE-260 Chrome package pages warmed"
          fi
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$PWD" --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv=CI=true --setenv="MASSION_E2E_BROWSER=$MASSION_E2E_BROWSER" \
            --property="IOReadBandwidthMax=$chrome_dir/chrome 2M" bash -ec '
              cgroup=$(cut -d: -f3 /proc/self/cgroup)
              cat "/sys/fs/cgroup$cgroup/io.max"
              node --test scripts/e2e/browser-*.test.mjs scripts/e2e/environment-work.test.mjs
            '
      - name: Upload accessibility snapshots, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journeys-${{ matrix.sample }}
          path: .runtime/e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
